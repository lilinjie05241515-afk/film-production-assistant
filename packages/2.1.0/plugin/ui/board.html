function conversationTree(snap){

 });
 const grouped=new Set(Object.values(parents).map(p=>p.thread_id));const orphaned=topics.filter(t=>!grouped.has(t.parent_thread_id));
 if(orphaned.length)groups.push(`<section class="panel"><h2>上级关联待核对</h2>${conversationRows(orphaned)}</section>`);
 const linked=new Set([...Object.values(parents).map(p=>p.thread_id),...topics.map(t=>t.thread_id)]);
 const other=registeredThreads(snap).filter(t=>!linked.has(t.thread_id));
 const extra=other.length?`<section class="panel"><h2>其他已关联工作对话</h2>${other.map(t=>`<div class="record-row"><strong>${esc(t.title)}</strong><button class="small" data-open-thread="${esc(t.thread_id)}">打开对话 ↗</button></div>`).join('')}</section>`:'';

 return awaiting+groups.join('')+extra+`<p class="quiet-note">层级与状态来自项目记录，刷新不会发起讨论或制作。已保存成果、用户采用和消息回报分别记录。</p>`;
}

class BoardFreshness {
 constructor(io){this.io=io;this.token=null;this.generation=0;this.running=false;this.pending=false;this.failures=0;this.lastChecked=null;this.lastUpdated=null;}
 accepted(snapshot){this.generation++;this.token=snapshot?.freshness_token||null;this.pending=false;this.lastUpdated=new Date();this.publish('updated');}
 publish(kind){this.io.status({kind,pending:this.pending,lastChecked:this.lastChecked,lastUpdated:this.lastUpdated,failures:this.failures});}
 async check(force=false){
  if(this.running||!this.io.ready()||!this.io.visible())return;
  this.running=true;const context=this.io.capture(),generation=this.generation;
  const valid=()=>generation===this.generation&&this.io.current(context);
  try{
   const marker=await this.io.poll(context);if(!valid())return;
   if(typeof marker.freshness_token!=='string'||!marker.freshness_token)throw new Error('更新检查响应不完整');
   this.lastChecked=new Date();this.failures=0;
   if(marker.system_version&&marker.system_version!==this.io.version){this.publish('upgrade');return;}
   if(!force&&marker.freshness_token===this.token){this.publish(this.pending?'pending':'checked');return;}
   this.pending=true;
   if(this.io.blocked()){this.publish('pending');return;}
   this.publish('loading');
   const snapshot=await this.io.read(context);if(!valid())return;
   // A form/video may have opened while the read was in flight.
   if(this.io.blocked()){this.publish('pending');return;}
   this.io.apply(snapshot,context);this.failures=0;
  }catch(error){if(valid()){this.failures++;this.publish('error');}}
  finally{this.running=false;}
 }
}

 const labels=[];

 if(topic.needs_completion_record)labels.push('完成待登记');
 else if(topic.completion_recorded)labels.push('完成已登记');

 return labels;
}

function disposePrevis(){previsSession++;for(const v of el('dialog-body')?.querySelectorAll?.('video')||[])v.pause();for(const u of previsUrls)URL.revokeObjectURL(u);previsUrls=[];previsActive=null;el('dialog')?.classList?.remove('previs-dialog');}
function previsRef(s,v){return {previs_id:s.previs_id,version:v.version,expected_sha256:v.sha256};}
async function loadPrevisVideo(s,v,view,session,token,status){
 const chunks=[];let offset=0,total=null;
 do{
  if(session!==previsSession||!isCurrent(token))throw new Error('已离开此次审看');
  const d=await call('previs.chunk',{expected_project_id:token.project_id,...previsRef(s,v),view,offset});
  if(d.previs_id!==s.previs_id||d.version!==v.version||d.view!==view||d.sha256!==v.files[view].sha256||d.offset!==offset||d.mime!=='video/mp4'||!Number.isInteger(d.total)||d.total<=0||d.total>134217728||(total!==null&&total!==d.total))throw new Error('完整视频身份或分块不匹配');
  const bytes=Uint8Array.from(atob(d.data_base64),c=>c.charCodeAt(0));
  if(!bytes.length||d.next!==offset+bytes.length||d.next>d.total)throw new Error('完整视频分块缺失');
  chunks.push(bytes);offset=d.next;total=d.total;if(status)status.textContent=`读取完整${view==='top'?'俯视':'镜头'}视频 ${Math.round(offset/total*100)}%`;
 }while(offset<total);
 const blob=new Blob(chunks,{type:'video/mp4'}),bytes=await blob.arrayBuffer();
 const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),x=>x.toString(16).padStart(2,'0')).join('');
 if(hash!==v.files[view].sha256)throw new Error('完整视频摘要不匹配');
 if(session!==previsSession||!isCurrent(token))throw new Error('已离开此次审看');
 const url=URL.createObjectURL(blob);previsUrls.push(url);return url;
}

async function importMedia(){if(!state)throw new Error('请先选择项目。');if(journal?.pending)throw new Error('请先核对待处理管理操作。');const token=capture(),kind=medium,names={image:'图片',video:'视频',audio:'音频'},choose={image:'media.choose_image',video:'media.choose',audio:'media.choose_audio'}[kind],chosen=await call(choose,{expected_project_id:token.project_id});assertCurrent(token);if(chosen.cancelled||!chosen.path)return notice('已取消文件选择。');const mediaId=kind.toUpperCase()+'-'+crypto.randomUUID(),source=chosen.path;show('导入已有'+names[kind],`<p>将所选文件复制到当前项目。导入后可分类、预览和引用。</p><form>${field('显示名称','title',source.split(/[\\/]/).pop(),'required maxlength="500"')}${kind==='image'?'<label>初始分类<select name="asset_type"><option value="unclassified">未分类</option><option value="character">人物</option><option value="scene">场景</option><option value="prop">道具</option><option value="other">其他</option></select></label>':kind==='video'?'<label>初始分类<select name="kind"><option value="take">生成素材 / 镜头</option><option value="clip">片段</option><option value="final">成片文件（未自动采用）</option></select></label>':'<label>初始分类<select name="audio_category"><option value="other">其他</option><option value="music">音乐</option><option value="dialogue">对白</option><option value="sfx">音效</option><option value="ambience">环境声</option></select></label>'}${field('来源 / 权利说明（未知可留空）','source_note')}${detail('本次选中的源文件',source)}${formButtons('导入到项目')}</form>`);bindForm(async form=>{const metadata={title:String(form.get('title')||'').trim(),source_note:String(form.get('source_note')||'')};if(kind==='image')metadata.asset_type=form.get('asset_type');if(kind==='audio')metadata.audio_category=form.get('audio_category');await manage({image:'media.import_image',video:'media.import',audio:'media.import_audio'}[kind],{path:source,media_id:mediaId,kind:kind==='video'?form.get('kind'):kind,metadata});notice('素材已导入。');});}
async function exportSelection(items){if(!items.length)throw new Error('请先选择准确资料。');const token=capture();show(`导出 ${items.length} 项准确资料`,`${selectedList(items)}<p>将所选文稿和素材保存为资料包。</p><form>${formButtons('导出所选版本')}</form>`);bindForm(async()=>{const payload={expected_project_id:token.project_id,items:items.map(item=>{const ref=exactRef(item,token.project_id);delete ref.expected_project_id;return ref;})},result=await call('board.export',payload);assertCurrent(token);if(!result.local_path||!result.sha256||!(result.verified||result.saved_verified||result.readback_verified))throw new Error('没有取得已核验的导出文件。');exportResults.push({...result,project_id:token.project_id,project_root:token.root,label:`${items.length} 项资料包`});notice('导出文件已保存并核验。可在“导出资料”查看路径。');render();});}
async function exportDocument(item){const token=capture(),result=await call('document.save',{expected_project_id:token.project_id,artifact_id:item.target_id,version:item.version,expected_sha256:item.sha256,op_id:'board-export-'+crypto.randomUUID()});assertCurrent(token);if(!result.saved_verified||!result.local_path)throw new Error('没有取得保存并核验的 Markdown 文件。');exportResults.push({...result,project_id:token.project_id,project_root:token.root,label:item.title+' v'+item.version});show('正文已导出',`<p>文稿已保存为 Markdown 文件。</p><textarea id="path-copy" class="copy-area" readonly>${esc(result.local_path)}</textarea><div class="actions"><button data-action="copy-path-text">复制路径</button><button data-open-path="${esc(result.local_path)}">打开导出文件 ↗</button></div>${detail('导出校验',{sha256:result.sha256,size_bytes:result.size_bytes,artifact_id:item.target_id,version:item.version})}`);}
function projectForm(action,id){const project=asList(catalog.projects).find(x=>x.project_id===id);if(action!=='register'&&!project)throw new Error('项目登记已变化，请刷新。');if(action==='register'||action==='relink'){show(action==='register'?'关联已有项目':'更新项目文件夹位置',`<p>${action==='register'?'选择已有影视项目所在的文件夹。':'如果你已移动项目文件夹，请填写它的新位置。此操作不会搬动文件。'}</p><form>${field('项目文件夹路径','root',project?.root||'','required')}${formButtons(action==='register'?'关联已有项目':'保存新位置')}</form>`);bindForm(async form=>{await manage('projects.'+action,{root:String(form.get('root')||'').trim(),...(action==='register'?{}:{project_id:id})});notice('项目位置登记已核对。');});}else if(action==='forget'){show('从看板移除项目',`<p>将从看板项目列表中删除「${esc(project.title||'未命名项目')}」，并解除它在影视插件中的聊天关联。</p><p><strong>本地文稿、素材、云端工作稿和工作对话都会保留。</strong>以后可以通过“关联已有项目”恢复到列表。</p><p class="dim">项目文件夹：${esc(project.root)}</p><form>${formButtons('仅从看板移除')}</form>`);bindForm(async()=>{await manage('projects.forget',{project_id:id,expected_root:project.root,...(project.registered_at?{expected_registered_at:project.registered_at}:{})});notice('项目已从看板移除，本地文件和工作对话已保留。');});}else if(action==='bind'){if(!hostContext.thread_id)throw new Error('当前宿主未提供真实聊天身份。');show('关联当前聊天',`<p>将当前聊天关联到「${esc(project.title)}」。只调整项目定位记录。</p><form>${formButtons('关联本聊天')}</form>`);bindForm(async()=>{await manage('projects.bind',{project_id:id,thread_id:hostContext.thread_id,replace:true});notice('当前聊天项目关联已更新。');});}}
async function actionHandler(button){if(projectLoading)throw new Error('正在切换项目，请等待本次读取完成。');const d=button.dataset;if(d.theme){setTheme2000(d.theme);return;}if(d.action==='toggle-theme'){setTheme2000(theme2000==='dark'?'light':'dark');return;}if(d.action==='dialog-back')return backDialog2000();if(d.previs){await openPrevis(d.previs);return;}if(await creatorAction(d))return;if(d.view)return navigate(d.view);if(d.medium){medium=d.medium;query='';category='';page=0;selected.clear();return render();}if(d.openKey){const item=itemByKey(d.openKey);if(!item)throw new Error('资料已变化，请刷新。');return item.target_type==='artifact'?openExactArtifact(item.target_id,item.version):preview(item);}if(d.readArtifact)return openExactArtifact(d.readArtifact,Number(d.version));if(d.reference){const item=itemByKey(d.reference);if(!item)throw new Error('资料已变化，请刷新。');return openReference(item);}if(d.organize){const item=itemByKey(d.organize);if(!item||item.deleted)throw new Error('所选资料已回收或变化。');return organize(item);}if(d.history)return showHistory(d.history);if(d.compareHistory)return compareHistory(d.compareHistory);if(d.scrollDocument!==undefined){el('doc-'+d.scrollDocument)?.scrollIntoView({block:'start'});return;}if(d.preview)return preview(itemByKey(d.preview));if(d.original)return original(itemByKey(d.original));if(d.documentExport)return exportDocument(itemByKey(d.documentExport));if(d.copyBody){const item=itemByKey(d.copyBody),a=await readArtifact(item.target_id,item.version,item.sha256);return copyText(plainContent(a.content),'准确版本完整正文已复制。');}if(d.restore)return trashItems([itemByKey(d.restore)],false);if(d.mediaPage!==undefined){page=Number(d.mediaPage);return render();}if(d.openThread){if(!registeredThreads(state).some(t=>t.thread_id===d.openThread))throw new Error('对话未关联到当前项目。');return openLink('codex://threads/'+d.openThread);}if(d.openUrl)return openLink(d.openUrl);if(d.openPath){try{await openLink(localFileURL(d.openPath));}catch(error){notice('客户端未打开此本机路径：'+error.message+' 可复制窗口中已核验的路径。',true);}return;}if(d.projectOpen){const project=asList(catalog.projects).find(x=>x.project_id===d.projectOpen);return switchProject(project);}if(d.projectFolder){const project=asList(catalog.projects).find(p=>p.project_id===d.projectFolder);if(!project)throw new Error('项目已变化，请刷新列表。');return show('项目文件夹 · '+(project.title||'未命名项目'),`<p>文稿、素材和项目资料保存在这个文件夹中。</p><textarea id="path-copy" class="copy-area" readonly>${esc(project.root)}</textarea><div class="actions"><button data-open-path="${esc(project.root)}">打开文件夹 ↗</button><button data-action="copy-path-text">复制路径</button></div>`);}if(d.projectRelink)return projectForm('relink',d.projectRelink);if(d.projectBind)return projectForm('bind',d.projectBind);if(d.projectForget)return projectForm('forget',d.projectForget);if(d.retryDoc){const item=itemByKey(d.retryDoc);contentCache.delete(JSON.stringify([item.target_id,item.version]));return fillDocumentBodies();}if(d.exportResult!==undefined){const result=exportResults[Number(d.exportResult)];if(!result||result.project_id!==state?.project?.project_id||rootIdentity(result.project_root)!==rootIdentity(root))throw new Error('导出记录属于另一项目，请先打开对应项目。');return show('导出文件',`<textarea id="path-copy" class="copy-area" readonly>${esc(result.local_path)}</textarea><div class="actions"><button data-action="copy-path-text">复制路径</button><button data-open-path="${esc(result.local_path)}">打开文件 ↗</button></div>${detail('校验摘要',result.sha256)}`);}const action=d.action;if(action==='close-dialog')return backDialog2000();if(action==='manage-categories')return manageCategories();if(action==='batch-organize')return batchOrganize();if(action==='batch-trash')return trashItems(selectionItems(),true);if(action==='export-selection')return exportSelection(selectionItems());if(action==='import-media')return importMedia();if(action==='register-project')return projectForm('register');if(action==='copy-reference-text')return copyText(el('reference-copy').value,'资料引用已复制。');if(action==='copy-path-text')return copyText(el('path-copy').value,'路径已复制。');if(action==='verify-pending'||action==='retry-pending'){const out=await (action==='verify-pending'?journal.verify():journal.retry());await acceptManaged(out);notice('操作已完成。');return;}if(action==='unbind-project'){if(!hostContext.thread_id)throw new Error('缺少当前聊天身份。');show('解除当前聊天关联','<p>解除本聊天与影视项目的定位关联，项目文件与聊天保留。</p><form>'+formButtons('解除关联')+'</form>');bindForm(async()=>{await manage('projects.unbind',{kind:'thread',binding_id:hostContext.thread_id,project_id:catalog.current_thread_project.project_id});notice('已解除本聊天关联。');});}}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;if(button.dataset.categoryMove!==undefined||button.dataset.action==='add-category')return;void actionHandler(button).catch(error=>notice(error.message,true));});
document.addEventListener('change',event=>{const target=event.target;if(target.id==='creator-task-scope'){creatorTaskScope=target.value;render();return;}if(target.id==='object-status'){objectStatus=target.value;render();return;}if(target.id==='object-scope'){objectScope=target.value;render();return;}if(target.dataset.selectKey){target.checked?selected.add(target.dataset.selectKey):selected.delete(target.dataset.selectKey);render();return;}if(target.id==='select-all'){for(const item of allFiltered())target.checked?selected.add(itemKey(item)):selected.delete(itemKey(item));render();return;}if(target.id==='category-filter'){category=target.value;page=0;selected.clear();render();}else if(target.id==='role-filter'){role=target.value;selected.clear();render();}else if(target.id==='review-filter'){reviewFilter=target.value;render();}});
let searchTimer=null;document.addEventListener('input',event=>{if(['library-query','review-query','trash-query','object-query','creator-task-query'].includes(event.target.id)){const id=event.target.id,value=event.target.value,selection=event.target.selectionStart,searchContext=capture(),searchView=view;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{if(!isCurrent(searchContext)||view!==searchView)return;if(id==='creator-task-query')creatorTaskQuery=value;else query=value;page=0;selected.clear();render();const input=el(id);if(input){input.focus();try{input.setSelectionRange(selection,selection);}catch{}}},180);}});
el('refresh').onclick=()=>void refresh().catch(error=>notice(error.message,true));el('project-picker').onchange=event=>{const p=asList(catalog.projects).find(x=>x.project_id===event.target.value);if(p)void switchProject(p).catch(error=>{notice(error.message,true);renderCatalog();});};el('aux-mobile').onchange=event=>{if(event.target.value)navigate(event.target.value);};el('dialog-close').onclick=closeDialog;el('dialog').addEventListener('cancel',event=>{event.preventDefault();closeDialog();});el('dialog').addEventListener('close',()=>{dialogTrail2000=[];dialogBackButton2000();disposePrevis();dialogDirty=false;renderCatalog();requestFreshness();});for(const type of ['input','change'])el('dialog-body').addEventListener(type,event=>{if(event.target.closest('form'))dialogDirty=true;});window.addEventListener('beforeunload',event=>{if(dialogDirty||journal?.pending){event.preventDefault();event.returnValue='';}});
async function initialize(){render();if(parent===window){el('host-state').textContent='';notice('请在影视插件中打开看板。');return;}bridge=new RpcBridge(parent,window,{onNotification:(method,params)=>{if(method==='ui/notifications/tool-input'){const input=params?.arguments||{};if(!state&&input.root)initialRoot=input.root;mergeContext(input.payload||input);}else if(method==='ui/notifications/tool-result'){const data=unwrap(params);mergeContext(data.host_context);if(data.project||data.catalog)requestFreshness();}},onError:error=>notice(error.message,true)});try{const init=await bridge.request('ui/initialize',{appInfo:{name:'film-production-agent-board',version:VERSION},appCapabilities:{},protocolVersion:'2026-01-26'});mergeContext(init?.hostContext||init?.host_context);bridge.notify('ui/notifications/initialized',{});const snap=await call('snapshot',context(),initialRoot);mergeContext(snap.host_context);if(snap.catalog)catalog=snap.catalog;else catalog=await call('projects.list',context(),'');mergeContext(catalog.host_context);let storage=null;try{storage=localStorage;}catch{}journal=new ManagementJournal({call:req=>call(req.action,req.payload,req.root),read:journalRead,storage,owner:context(),onChange:renderPending});connected=true;scheduleFreshness();el('host-state').textContent='';if(journal.pending&&!journal.pending.action.startsWith('projects.')){const request=journal.pending,original=await call('snapshot',{expected_project_id:request.payload.expected_project_id},request.root);accept(original,{expectedRoot:request.root,expectedId:request.payload.expected_project_id});notice('上次操作尚未完成，请先检查结果。',true);}else accept(snap);if(journal.warning)notice(journal.warning,true);renderPending();}catch(error){el('host-state').textContent='加载未完成';notice(error.message,true);}}
initAppearance2000();
void initialize();
}
