<script>
'use strict';
const VERSION='1.17.0';
const MAIN_NAV=[['overview','项目总览'],['tasks','创作任务'],['documents','文稿资料'],['media','素材库'],['reviews','审核记录']];
const AUX_NAV=[['threads','工作对话'],['exports','导出资料'],['trash','回收站'],['projects','项目管理']];
const READ_ACTIONS=new Set(['snapshot','artifact.get','artifact.history','document.export','board.reference','board.usage','projects.list','projects.outcome','media.choose','media.choose_image','media.choose_audio','media.preview','media.preview_image','media.preview_audio','media.original']);
const MANAGE_ACTIONS=new Set(['board.item.set','board.categories.set','board.items.batch','trash.set','presentation.set','board.order.set','media.update','media.classify','media.import','media.import_image','media.import_audio','projects.register','projects.relink','projects.bind','projects.unbind','projects.forget']);
const EXPORT_ACTIONS=new Set(['board.export','document.save']);
const ALL_ACTIONS=new Set([...READ_ACTIONS,...MANAGE_ACTIONS,...EXPORT_ACTIONS]);
const KIND_LABELS={story:'大纲',outline:'故事大纲',novel:'小说',character_bio:'人物小传',style_bible:'风格圣经',source_script:'剧本底稿',script:'剧本',screenplay:'剧本',director:'导演方案',vfx:'特效方案',asset:'资产文字',prompt:'资产提示词',video_prompt:'视频提示词',research:'研究',analysis:'研究',idea:'灵感记录',requirements:'需求资料',image:'图片',video:'视频',audio:'音频'};
const ROLE_LABELS={latest_working:'最新工作稿',latest_adopted:'最新采用版',task_input_locked:'任务使用版',production_locked:'本批制作版'};
const STATUS_LABELS={incomplete:'待完善',needs_revision:'待修改',reviewed:'已复核',historical_record:'历史记录',open:'待处理',created:'待开始',in_progress:'进行中',completed:'已完成',blocked:'待解决',pending_user:'待你确认',needs_user_confirmation:'待你确认',awaiting_user:'待你确认',pending_confirmation:'待你确认',revised:'已修订',synced:'已同步',not_recorded:'未记录',unknown:'未知',recorded:'已有记录',needs_review:'需复核',current_adopted:'当前采用',historical_adopted:'历史采用',scope_adopted:'指定范围已采用',approved:'已通过',adopt:'采用',reject:'未通过',pending:'待处理',resolved:'已处理',not_bound:'未关联',verified:'已核对',pending_sync:'待同步',conflict:'有冲突',failed:'失败',active:'进行中',submitted:'已提交',cancelled:'已取消',candidate:'候选',pending_review:'待复核',not_applicable:'不适用'};
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plainContent=value=>typeof value==='string'?value:JSON.stringify(value===undefined?'':value,null,2);
const asList=value=>Array.isArray(value)?value:[];
const rootIdentity=value=>String(value||'').replaceAll('\\','/').replace(/\/+$/,'').toLowerCase();
const itemKey=item=>JSON.stringify([item.target_type,item.target_id,item.version??null,item.sha256]);
const stamp=value=>{if(!value)return '未记录';const d=new Date(value);return Number.isNaN(d.valueOf())?String(value):d.toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});};
const statusLabel=value=>STATUS_LABELS[value]||'未记录';
function findTextMatches(value,query){const text=plainContent(value),needle=String(query||'').trim();if(!needle)return [];const a=text.toLocaleLowerCase(),b=needle.toLocaleLowerCase(),hits=[];let pos=0;while((pos=a.indexOf(b,pos))>=0){hits.push({start:pos,end:pos+needle.length});pos+=Math.max(1,needle.length);}return hits;}
function badge(value,label){return `<span class="badge ${['current_adopted','verified','approved'].includes(value)?'good':['needs_review','conflict','pending_review'].includes(value)?'warn':''}">${esc(label||statusLabel(value))}</span>`;}
function roleBadges(item){return asList(item.version_roles).map(role=>badge(role,ROLE_LABELS[role]||role)).join('');}
function detail(title,value){return title==='本次选中的源文件'?`<p class="dim">文件：${esc(String(value).split(/[\\/]/).pop())}</p>`:'';}
function empty(text){return `<div class="empty">${esc(text)}</div>`;}
function safePreviewURI(value,kind){const patterns={image:/^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/,video:/^data:video\/mp4;base64,[A-Za-z0-9+/=]+$/,audio:/^data:audio\/(?:mpeg|mp3|wav|x-wav|ogg|mp4);base64,[A-Za-z0-9+/=]+$/};return typeof value==='string'&&patterns[kind]?.test(value)?value:null;}
function verifyPreview(preview,item,projectId){if(preview.media_id!==item.target_id||preview.kind!==item.kind||preview.sha256!==item.sha256||preview.project_id!==projectId)throw new Error('预览身份或原件摘要不匹配，已拒绝展示。');return preview;}
function exactRef(item,projectId){if(!item||!['artifact','media'].includes(item.target_type)||typeof item.target_id!=='string'||!/^[a-f0-9]{64}$/.test(item.sha256||''))throw new Error('资料身份不完整，请刷新。');if(item.target_type==='artifact'&&(!Number.isInteger(item.version)||item.version<1))throw new Error('文稿必须指定准确版本。');return {expected_project_id:projectId,target_type:item.target_type,target_id:item.target_id,...(item.target_type==='artifact'?{version:item.version}:{}),expected_sha256:item.sha256};}
function organizationPayload(item,projectId,values){const title=String(values.title??item.title??'').trim(),tags=typeof values.tags==='string'?values.tags.split(/[,，\n]/).map(x=>x.trim()).filter(Boolean):asList(values.tags??item.tags);if(!title||title.length>500)throw new Error('显示名称需为 1 至 500 字。');if(tags.some(x=>typeof x!=='string'||x.length>80))throw new Error('标签需为文字，每项不超过 80 字。');return {...exactRef(item,projectId),base_revision:item.revision||0,title,category_id:values.category_id??item.category_id,tags:[...new Set(tags)],asset_id:String(values.asset_id??item.asset_id??'').trim()||null};}
function trashPayload(item,projectId,deleted){return {...exactRef(item,projectId),base_revision:item.trash_revision||0,deleted:Boolean(deleted)};}
function matchesItem(item,query,content){const needle=String(query||'').trim().toLocaleLowerCase();return !needle||[item.title,item.target_id,item.scope,item.asset_id,...asList(item.tags),plainContent(content??'')].join(' ').toLocaleLowerCase().includes(needle);}
function filterItems(items,{medium=null,query='',category='',role='',deleted=false,content=()=>''}={}){return asList(items).filter(item=>Boolean(item.deleted)===deleted&&(!medium||item.media_kind===medium)&&(!category||item.category_id===category)&&(!role||asList(item.version_roles).includes(role))&&matchesItem(item,query,content(item)));}
function mediaCounts(items){const result={image:0,video:0,audio:0,document:0};for(const item of asList(items))if(!item.deleted&&Object.hasOwn(result,item.media_kind))result[item.media_kind]++;return result;}
function referenceVersionBoxes(item){return `<div class="version-grid"><div class="version-box"><small>最新工作稿</small>${item.latest_working_version?'v'+esc(item.latest_working_version):'未记录'}</div><div class="version-box"><small>最新采用版</small>${item.latest_adopted_version?'v'+esc(item.latest_adopted_version):'未记录'}</div><div class="version-box"><small>本批制作版</small>${asList(item.production_locked_by).length?'此版本用于本批制作':'未指定'}</div></div>`;}

function batchOrganize(){const items=selectionItems();if(!items.length)throw new Error('请先勾选资料。');if(new Set(items.map(x=>x.media_kind)).size!==1)throw new Error('批量分类需选择同一类资料。');const categories=categoriesFor(state,items[0].media_kind).categories;show(`批量整理 ${items.length} 项`,`${selectedList(items)}<form><label>管理分类<select name="category_id">${optionHTML(categories,'','保留各自分类')}</select></label>${field('追加标签（逗号分隔，可空）','tags')}<p class="quiet-note">为所选资料设置分类或追加标签。</p>${formButtons('保存')}</form>`);bindForm(async form=>{const tags=String(form.get('tags')||'').split(/[,，\n]/).map(x=>x.trim()).filter(Boolean),projectId=state.project.project_id;const updates=items.map(item=>{const full=organizationPayload(item,projectId,{title:item.title,category_id:form.get('category_id')||item.category_id,tags:[...asList(item.tags),...tags],asset_id:item.asset_id});delete full.expected_project_id;return full;});await manage('board.items.batch',{operation:'organize',items:updates});notice(`已整理 ${items.length} 项资料并读回。`);});}
function trashItems(items,deleted){if(!items.length)throw new Error('请先选择资料。');show(deleted?`将 ${items.length} 项移入回收站`:'恢复资料',`${selectedList(items)}<p>移入回收站后可恢复，原文件仍保留，不释放磁盘空间。</p><form>${formButtons(deleted?'移入回收站':'恢复')}</form>`);bindForm(async()=>{const pid=state.project.project_id;if(items.length===1)await manage('trash.set',trashPayload(items[0],pid,deleted));else await manage('board.items.batch',{operation:'trash',items:items.map(item=>{const p=trashPayload(item,pid,deleted);delete p.expected_project_id;return p;})});notice(deleted?'已移入回收站，原件和既有引用保留。':'已恢复，审核与采用保持原记录。');});}
function manageCategories(){const type=view==='documents'?'document':medium,group=categoriesFor(state,type),rows=asList(group.categories).map(x=>({...x}));show('管理分类与显示顺序',`<p>仅调整 ${esc({document:'文稿',image:'图片',video:'视频',audio:'音频'}[type])} 的管理分类。分类顺序不改变创作阶段或正文顺序。</p><form><div id="category-rows"></div><button type="button" data-action="add-category">＋ 新增分类</button>${formButtons('保存分类与顺序')}</form>`);const renderRows=()=>{el('category-rows').innerHTML=rows.map((row,index)=>`<div class="category-row"><input data-category-label="${index}" value="${esc(row.label)}" aria-label="分类 ${esc(row.id)} 的名称" required maxlength="80"><button type="button" data-category-move="${index}" data-direction="-1" ${index===0?'disabled':''}>上移</button><button type="button" data-category-move="${index}" data-direction="1" ${index===rows.length-1?'disabled':''}>下移</button></div>`).join('');};renderRows();el('category-rows').addEventListener('input',e=>{if(e.target.dataset.categoryLabel!==undefined)rows[Number(e.target.dataset.categoryLabel)].label=e.target.value;});el('category-rows').addEventListener('click',e=>{const button=e.target.closest('[data-category-move]');if(!button)return;const index=Number(button.dataset.categoryMove),next=index+Number(button.dataset.direction);if(next<0||next>=rows.length)return;[rows[index],rows[next]]=[rows[next],rows[index]];dialogDirty=true;renderRows();});el('dialog-body').querySelector('[data-action=add-category]').onclick=()=>{rows.push({id:'custom-'+crypto.randomUUID(),label:'新分类'});dialogDirty=true;renderRows();el('category-rows').lastElementChild.querySelector('input').focus();};bindForm(async()=>{const categories=rows.map(x=>({...x,label:x.label.trim()}));if(categories.some(x=>!x.label))throw new Error('分类名称不能为空。');await manage('board.categories.set',{media_kind:type,base_revision:group.revision,categories});notice('分类名称与顺序已保存。');});}
async function manage(action,payload){if(projectLoading)throw new Error('正在切换项目，请等待本次读取完成。');if(!journal)throw new Error('管理连接尚未就绪。');const frozen=capture(),full=action.startsWith('projects.')?payload:{...payload,expected_project_id:frozen.project_id},out=await journal.run(root,action,full);await acceptManaged(out);return out;}
async function acceptManaged(out){if(out.request.action.startsWith('projects.')){catalog=out.snapshot;if(out.request.action==='projects.forget'&&state?.project?.project_id===out.request.payload.project_id){state=null;root='';epoch++;readSerial++;contentCache.clear();loadedHistory.clear();selected.clear();}render();}else if(rootIdentity(root)===rootIdentity(out.request.root)&&state?.project?.project_id===out.request.payload.expected_project_id)accept(out.snapshot,{expectedRoot:root,expectedId:state.project.project_id});}
async function journalRead(request){if(request.action.startsWith('projects.')){const outcome=await call('projects.outcome',{op_id:request.payload.op_id,...context()},''),listed=await call('projects.list',context(),'');return {...listed,operations:[...asList(listed.operations),...(outcome.operation?[outcome.operation]:[])]};}return call('snapshot',{expected_project_id:request.payload.expected_project_id},request.root);}
async function preview(item){if(!item)throw new Error('素材已变化，请刷新。');const token=capture(),names={image:'图片低清预览',video:'视频前 12 秒低清预览',audio:'音频短段试听'},action={image:'media.preview_image',video:'media.preview',audio:'media.preview_audio'}[item.kind];if(!action)throw new Error('此媒体类型暂无预览。');const session=show(item.title,`<p>${esc(names[item.kind])}</p><p role="status">正在读取预览…</p>`);try{const result=await call(action,{expected_project_id:token.project_id,media_id:item.target_id});if(!isCurrent(token)||dialogSession!==session||!el('dialog').open)return;verifyPreview(result,item,token.project_id);const uri=safePreviewURI(result.preview_data_uri,item.kind),thumb=safePreviewURI(result.thumbnail_data_uri,'image'),body=uri&&result.preview_inline_available?(item.kind==='image'?`<img class="preview" src="${esc(uri)}" alt="${esc(item.title)} 的低清预览">`:item.kind==='video'?`<video class="preview" controls preload="metadata" ${thumb?`poster="${esc(thumb)}"`:''} src="${esc(uri)}"></video>`:`<audio class="audio-preview" controls preload="metadata" src="${esc(uri)}"></audio>`):(thumb?`<img class="preview" src="${esc(thumb)}" alt="低清缩略图">`:'')+`<p class="quiet-note">暂时无法预览，可打开原件查看。</p>`;el('dialog-body').innerHTML=`<p>${esc(names[item.kind])}</p>${body}<div class="actions"><button data-original="${esc(itemKey(item))}">打开原件 ↗</button><button data-reference="${esc(itemKey(item))}">来源与引用</button></div>${detail('预览身份',{media_id:item.target_id,kind:item.kind,sha256:item.sha256,preview_kind:result.preview_kind,duration_seconds:result.duration_seconds})}`;}catch(error){if(isCurrent(token)&&dialogSession===session)el('dialog-body').innerHTML=`<p class="load-error">暂时无法预览，请重试或打开原件。</p><button data-original="${esc(itemKey(item))}">核对原件路径</button>`;}}
async function original(item){if(!item)throw new Error('素材已变化，请刷新。');const token=capture(),result=await call('media.original',{expected_project_id:token.project_id,media_id:item.target_id});assertCurrent(token);if(result.media_id!==item.target_id||result.sha256!==item.sha256||result.kind!==item.kind||result.project_id!==token.project_id||!result.hash_verified)throw new Error('原件身份或摘要未核验。');show('原件 · '+item.title,`<p>打开原始文件，或复制文件路径。</p><textarea id="path-copy" class="copy-area" readonly>${esc(result.local_path)}</textarea><div class="actions"><button data-open-path="${esc(result.local_path)}">打开本机原件 ↗</button><button data-action="copy-path-text">复制路径</button></div>${detail('原件校验',{media_id:result.media_id,sha256:result.sha256,hash_verified:result.hash_verified})}`);}
async function importMedia(){if(!state)throw new Error('请先选择项目。');if(journal?.pending)throw new Error('请先核对待处理管理操作。');const token=capture(),kind=medium,names={image:'图片',video:'视频',audio:'音频'},choose={image:'media.choose_image',video:'media.choose',audio:'media.choose_audio'}[kind],chosen=await call(choose,{expected_project_id:token.project_id});assertCurrent(token);if(chosen.cancelled||!chosen.path)return notice('已取消文件选择。');const mediaId=kind.toUpperCase()+'-'+crypto.randomUUID(),source=chosen.path;show('导入已有'+names[kind],`<p>将所选文件复制到当前项目。导入后可分类、预览和引用。</p><form>${field('显示名称','title',source.split(/[\\/]/).pop(),'required maxlength="500"')}${kind==='image'?'<label>初始分类<select name="asset_type"><option value="unclassified">未分类</option><option value="character">人物</option><option value="scene">场景</option><option value="prop">道具</option><option value="other">其他</option></select></label>':kind==='video'?'<label>初始分类<select name="kind"><option value="take">生成素材 / 镜头</option><option value="clip">片段</option><option value="final">成片文件（未自动采用）</option></select></label>':'<label>初始分类<select name="audio_category"><option value="other">其他</option><option value="music">音乐</option><option value="dialogue">对白</option><option value="sfx">音效</option><option value="ambience">环境声</option></select></label>'}${field('来源 / 权利说明（未知可留空）','source_note')}${detail('本次选中的源文件',source)}${formButtons('导入到项目')}</form>`);bindForm(async form=>{const metadata={title:String(form.get('title')||'').trim(),source_note:String(form.get('source_note')||'')};if(kind==='image')metadata.asset_type=form.get('asset_type');if(kind==='audio')metadata.audio_category=form.get('audio_category');await manage({image:'media.import_image',video:'media.import',audio:'media.import_audio'}[kind],{path:source,media_id:mediaId,kind:kind==='video'?form.get('kind'):kind,metadata});notice('素材已导入。');});}
async function exportSelection(items){if(!items.length)throw new Error('请先选择准确资料。');const token=capture();show(`导出 ${items.length} 项准确资料`,`${selectedList(items)}<p>将所选文稿和素材保存为资料包。</p><form>${formButtons('导出所选版本')}</form>`);bindForm(async()=>{const payload={expected_project_id:token.project_id,items:items.map(item=>{const ref=exactRef(item,token.project_id);delete ref.expected_project_id;return ref;})},result=await call('board.export',payload);assertCurrent(token);if(!result.local_path||!result.sha256||!(result.verified||result.saved_verified||result.readback_verified))throw new Error('没有取得已核验的导出文件。');exportResults.push({...result,project_id:token.project_id,project_root:token.root,label:`${items.length} 项资料包`});notice('导出文件已保存并核验。可在“导出资料”查看路径。');render();});}
async function exportDocument(item){const token=capture(),result=await call('document.save',{expected_project_id:token.project_id,artifact_id:item.target_id,version:item.version,expected_sha256:item.sha256,op_id:'board-export-'+crypto.randomUUID()});assertCurrent(token);if(!result.saved_verified||!result.local_path)throw new Error('没有取得保存并核验的 Markdown 文件。');exportResults.push({...result,project_id:token.project_id,project_root:token.root,label:item.title+' v'+item.version});show('正文已导出',`<p>文稿已保存为 Markdown 文件。</p><textarea id="path-copy" class="copy-area" readonly>${esc(result.local_path)}</textarea><div class="actions"><button data-action="copy-path-text">复制路径</button><button data-open-path="${esc(result.local_path)}">打开导出文件 ↗</button></div>${detail('导出校验',{sha256:result.sha256,size_bytes:result.size_bytes,artifact_id:item.target_id,version:item.version})}`);}
function projectForm(action,id){const project=asList(catalog.projects).find(x=>x.project_id===id);if(action!=='register'&&!project)throw new Error('项目登记已变化，请刷新。');if(action==='register'||action==='relink'){show(action==='register'?'关联已有项目':'更新项目文件夹位置',`<p>${action==='register'?'选择已有影视项目所在的文件夹。':'如果你已移动项目文件夹，请填写它的新位置。此操作不会搬动文件。'}</p><form>${field('项目文件夹路径','root',project?.root||'','required')}${formButtons(action==='register'?'关联已有项目':'保存新位置')}</form>`);bindForm(async form=>{await manage('projects.'+action,{root:String(form.get('root')||'').trim(),...(action==='register'?{}:{project_id:id})});notice('项目位置登记已核对。');});}else if(action==='forget'){show('从看板删除项目',`<p>将从看板项目列表中删除「${esc(project.title||'未命名项目')}」，并解除它在影视插件中的聊天关联。</p><p><strong>本地文稿、素材、云端工作稿和工作对话都会保留。</strong>以后可以通过“关联已有项目”恢复到列表。</p><p class="dim">项目文件夹：${esc(project.root)}</p><form>${formButtons('确认从看板删除')}</form>`);bindForm(async()=>{await manage('projects.forget',{project_id:id,expected_root:project.root,...(project.registered_at?{expected_registered_at:project.registered_at}:{})});notice('项目已从看板删除，本地文件和工作对话已保留。');});}else if(action==='bind'){if(!hostContext.thread_id)throw new Error('当前宿主未提供真实聊天身份。');show('关联当前聊天',`<p>将当前聊天关联到「${esc(project.title)}」。只调整项目定位记录。</p><form>${formButtons('关联本聊天')}</form>`);bindForm(async()=>{await manage('projects.bind',{project_id:id,thread_id:hostContext.thread_id,replace:true});notice('当前聊天项目关联已更新。');});}}
async function actionHandler(button){if(projectLoading)throw new Error('正在切换项目，请等待本次读取完成。');const d=button.dataset;if(d.view)return navigate(d.view);if(d.medium){medium=d.medium;query='';category='';page=0;selected.clear();return render();}if(d.openKey){const item=itemByKey(d.openKey);if(!item)throw new Error('资料已变化，请刷新。');return item.target_type==='artifact'?openExactArtifact(item.target_id,item.version):preview(item);}if(d.readArtifact)return openExactArtifact(d.readArtifact,Number(d.version));if(d.reference){const item=itemByKey(d.reference);if(!item)throw new Error('资料已变化，请刷新。');return openReference(item);}if(d.organize){const item=itemByKey(d.organize);if(!item||item.deleted)throw new Error('所选资料已回收或变化。');return organize(item);}if(d.history)return showHistory(d.history);if(d.compareHistory)return compareHistory(d.compareHistory);if(d.scrollDocument!==undefined){el('doc-'+d.scrollDocument)?.scrollIntoView({block:'start'});return;}if(d.preview)return preview(itemByKey(d.preview));if(d.original)return original(itemByKey(d.original));if(d.documentExport)return exportDocument(itemByKey(d.documentExport));if(d.copyBody){const item=itemByKey(d.copyBody),a=await readArtifact(item.target_id,item.version,item.sha256);return copyText(plainContent(a.content),'准确版本完整正文已复制。');}if(d.restore)return trashItems([itemByKey(d.restore)],false);if(d.mediaPage!==undefined){page=Number(d.mediaPage);return render();}if(d.openThread){if(!registeredThreads(state).some(t=>t.thread_id===d.openThread))throw new Error('对话未关联到当前项目。');return openLink('codex://threads/'+d.openThread);}if(d.openUrl)return openLink(d.openUrl);if(d.openPath){try{await openLink(localFileURL(d.openPath));}catch(error){notice('客户端未打开此本机路径：'+error.message+' 可复制窗口中已核验的路径。',true);}return;}if(d.projectOpen){const project=asList(catalog.projects).find(x=>x.project_id===d.projectOpen);return switchProject(project);}if(d.projectFolder){const project=asList(catalog.projects).find(p=>p.project_id===d.projectFolder);if(!project)throw new Error('项目已变化，请刷新列表。');return show('项目文件夹 · '+(project.title||'未命名项目'),`<p>文稿、素材和项目资料保存在这个文件夹中。</p><textarea id="path-copy" class="copy-area" readonly>${esc(project.root)}</textarea><div class="actions"><button data-open-path="${esc(project.root)}">打开文件夹 ↗</button><button data-action="copy-path-text">复制路径</button></div>`);}if(d.projectRelink)return projectForm('relink',d.projectRelink);if(d.projectBind)return projectForm('bind',d.projectBind);if(d.projectForget)return projectForm('forget',d.projectForget);if(d.retryDoc){const item=itemByKey(d.retryDoc);contentCache.delete(JSON.stringify([item.target_id,item.version]));return fillDocumentBodies();}if(d.exportResult!==undefined){const result=exportResults[Number(d.exportResult)];if(!result||result.project_id!==state?.project?.project_id||rootIdentity(result.project_root)!==rootIdentity(root))throw new Error('导出记录属于另一项目，请先打开对应项目。');return show('导出文件',`<textarea id="path-copy" class="copy-area" readonly>${esc(result.local_path)}</textarea><div class="actions"><button data-action="copy-path-text">复制路径</button><button data-open-path="${esc(result.local_path)}">打开文件 ↗</button></div>${detail('校验摘要',result.sha256)}`);}const action=d.action;if(action==='close-dialog')return closeDialog();if(action==='manage-categories')return manageCategories();if(action==='batch-organize')return batchOrganize();if(action==='batch-trash')return trashItems(selectionItems(),true);if(action==='export-selection')return exportSelection(selectionItems());if(action==='import-media')return importMedia();if(action==='register-project')return projectForm('register');if(action==='copy-reference-text')return copyText(el('reference-copy').value,'资料引用已复制。');if(action==='copy-path-text')return copyText(el('path-copy').value,'路径已复制。');if(action==='verify-pending'||action==='retry-pending'){const out=await (action==='verify-pending'?journal.verify():journal.retry());await acceptManaged(out);notice('操作已完成。');return;}if(action==='unbind-project'){if(!hostContext.thread_id)throw new Error('缺少当前聊天身份。');show('解除当前聊天关联','<p>解除本聊天与影视项目的定位关联，项目文件与聊天保留。</p><form>'+formButtons('解除关联')+'</form>');bindForm(async()=>{await manage('projects.unbind',{kind:'thread',binding_id:hostContext.thread_id,project_id:catalog.current_thread_project.project_id});notice('已解除本聊天关联。');});}}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled)return;if(button.dataset.categoryMove!==undefined||button.dataset.action==='add-category')return;void actionHandler(button).catch(error=>notice(error.message,true));});
document.addEventListener('change',event=>{const target=event.target;if(target.dataset.selectKey){target.checked?selected.add(target.dataset.selectKey):selected.delete(target.dataset.selectKey);render();return;}if(target.id==='select-all'){for(const item of allFiltered())target.checked?selected.add(itemKey(item)):selected.delete(itemKey(item));render();return;}if(target.id==='category-filter'){category=target.value;page=0;selected.clear();render();}else if(target.id==='role-filter'){role=target.value;selected.clear();render();}else if(target.id==='review-filter'){reviewFilter=target.value;render();}});
let searchTimer=null;document.addEventListener('input',event=>{if(['library-query','review-query','trash-query'].includes(event.target.id)){const id=event.target.id,value=event.target.value,selection=event.target.selectionStart,searchContext=capture(),searchView=view;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{if(!isCurrent(searchContext)||view!==searchView)return;query=value;page=0;selected.clear();render();const input=el(id);if(input){input.focus();try{input.setSelectionRange(selection,selection);}catch{}}},180);}});
el('refresh').onclick=()=>void refresh().catch(error=>notice(error.message,true));el('project-picker').onchange=event=>{const p=asList(catalog.projects).find(x=>x.project_id===event.target.value);if(p)void switchProject(p).catch(error=>{notice(error.message,true);renderCatalog();});};el('aux-mobile').onchange=event=>{if(event.target.value)navigate(event.target.value);};el('dialog-close').onclick=closeDialog;el('dialog').addEventListener('cancel',event=>{event.preventDefault();closeDialog();});el('dialog').addEventListener('close',()=>{dialogDirty=false;renderCatalog();});for(const type of ['input','change'])el('dialog-body').addEventListener(type,event=>{if(event.target.closest('form'))dialogDirty=true;});window.addEventListener('beforeunload',event=>{if(dialogDirty||journal?.pending){event.preventDefault();event.returnValue='';}});
async function initialize(){render();if(parent===window){el('host-state').textContent='';notice('请在影视插件中打开看板。');return;}bridge=new RpcBridge(parent,window,{onNotification:(method,params)=>{if(method==='ui/notifications/tool-input'){const input=params?.arguments||{};if(!state&&input.root)initialRoot=input.root;mergeContext(input.payload||input);}else if(method==='ui/notifications/tool-result'){const data=unwrap(params);mergeContext(data.host_context);if(!journal?.pending&&!el('dialog').open&&data.project&&(!root||rootIdentity(root)===rootIdentity(data.project_root)))accept(data);else if(data.catalog){catalog=data.catalog;renderCatalog();}}},onError:error=>notice(error.message,true)});try{const init=await bridge.request('ui/initialize',{appInfo:{name:'film-production-agent-board',version:VERSION},appCapabilities:{},protocolVersion:'2026-01-26'});mergeContext(init?.hostContext||init?.host_context);bridge.notify('ui/notifications/initialized',{});const snap=await call('snapshot',context(),initialRoot);mergeContext(snap.host_context);if(snap.catalog)catalog=snap.catalog;else catalog=await call('projects.list',context(),'');mergeContext(catalog.host_context);let storage=null;try{storage=localStorage;}catch{}journal=new ManagementJournal({call:req=>call(req.action,req.payload,req.root),read:journalRead,storage,owner:context(),onChange:renderPending});connected=true;el('host-state').textContent='';if(journal.pending&&!journal.pending.action.startsWith('projects.')){const request=journal.pending,original=await call('snapshot',{expected_project_id:request.payload.expected_project_id},request.root);accept(original,{expectedRoot:request.root,expectedId:request.payload.expected_project_id});notice('上次操作尚未完成，请先检查结果。',true);}else accept(snap);if(journal.warning)notice(journal.warning,true);renderPending();}catch(error){el('host-state').textContent='加载未完成';notice(error.message,true);}}
void initialize();
}
